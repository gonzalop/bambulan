<!DOCTYPE html>
<html>

<head>
    <title>BambuLAN File Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>File Manager</h1>
            <div style="display: flex; gap: 15px;">
                <a href="/" class="btn">Dashboard</a>
                <a href="/logout" class="btn">Logout</a>
            </div>
        </header>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="margin: 0;">Path: <span id="currentPathDisplay"
                        style="font-family: monospace; background: #f0f0f0; padding: 2px 5px; border-radius: 4px;">/</span>
                </h3>
                <div class="button-group">
                    <input type="file" id="uploadInput" style="display: none;" onchange="uploadFile()">
                    <button onclick="createFolder()" class="btn btn-warning">New Folder</button>
                    <button onclick="document.getElementById('uploadInput').click()" class="btn btn-primary">Upload
                        File</button>
                    <button onclick="loadFiles(currentPath)" class="btn">Refresh</button>
                </div>
            </div>

            <div id="file-list-container" style="min-height: 300px;">
                <div id="file-list">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Start Print Modal (Reuse similar structure) -->
    <div id="printModal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Start Print</h3>
            <div style="margin-bottom: 10px; font-weight: bold; color: var(--text-color);" id="printFilename"></div>
            <form id="printForm" onsubmit="startPrint(event)">
                <input type="hidden" name="existing_path" id="printExistingPath">

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Bed Type</label>
                    <select name="bed_type">
                        <option value="auto">Auto</option>
                        <option value="textured_plate">Textured Plate</option>
                        <option value="cool_plate">Cool Plate</option>
                        <option value="engineering_plate">Engineering Plate</option>
                        <option value="high_temp_plate">High Temp Plate</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                    <label><input type="checkbox" name="bed_leveling" checked> Bed Leveling</label>
                    <label><input type="checkbox" name="flow_calibration"> Flow Calibration</label>
                    <label><input type="checkbox" name="timelapse"> Timelapse</label>
                    <label><input type="checkbox" name="use_ams" id="chkUseAMS"> Use AMS</label>
                    <label><input type="checkbox" name="vibration_calibration" checked> Vibration Calibration</label>
                    <label><input type="checkbox" name="layer_inspection"> Layer Inspect</label>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closePrintModal()" class="btn">Cancel</button>
                    <button id="startBtn" type="submit" class="btn btn-primary">Start Print</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        /* Dropdown styles */
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .dropdown-content button,
        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            box-sizing: border-box;
            font-size: 14px;
        }

        .dropdown-content button:hover,
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown-divider {
            height: 1px;
            margin: 4px 0;
            overflow: hidden;
            background-color: #e5e5e5;
        }

        .show {
            display: block;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 0 10px;
            color: #666;
        }

        .menu-btn:hover {
            color: #333;
        }
    </style>
    <script>
        let currentPath = "/";

        // Global click to close menus
        window.onclick = function (event) {
            if (!event.target.matches('.menu-btn')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        function toggleMenu(id) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].id !== id) {
                    dropdowns[i].classList.remove('show');
                }
            }
            document.getElementById(id).classList.toggle("show");
        }

        function uploadFile() {
            const input = document.getElementById('uploadInput');
            if (input.files.length === 0) return;
            const file = input.files[0];
            if (/[<>\[\]:/\\|?*"]/.test(file.name)) {
                alert('Filename contains invalid characters: <>[]:/\\|?*"\nPlease rename the file and try again.');
                input.value = '';
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            formData.append('path', currentPath);
            const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            const statusDiv = document.getElementById('file-list');
            statusDiv.innerHTML = '<div style="text-align: center; padding: 20px;">Uploading ' + file.name + '... <span id="uploadDetails"></span></div>';
            const poller = setInterval(() => {
                fetch('/api/status').then(r => r.json()).then(d => {
                    if (d.upload_status && d.upload_status.uploading) {
                        const u = d.upload_status;
                        const details = document.getElementById('uploadDetails');
                        if (details) {
                            details.innerText = `(${u.percent.toFixed(1)}%)`;
                        }
                    }
                });
            }, 500);
            fetch('/api/upload', {
                method: 'POST',
                headers: { 'X-CSRF-Token': token },
                body: formData
            }).then(resp => {
                clearInterval(poller);
                if (resp.status === 403) {
                    alert("Session expired or invalid. Reloading...");
                    window.location.reload();
                    return;
                }
                if (!resp.ok) resp.text().then(text => alert("Upload failed: " + text));
                else { loadFiles(currentPath); }
                input.value = '';
            }).catch(err => {
                clearInterval(poller);
                alert("Upload error: " + err);
            });
        }

        async function createFolder() {
            const name = prompt("Enter folder name:");
            if (!name) return;
            if (/[<>\[\]:/\\|?*"]/.test(name)) {
                alert('Folder name contains invalid characters: <>[]:/\\|?*"');
                return;
            }
            const fullPath = currentPath + name;
            const formData = new FormData();
            formData.append('path', fullPath);
            const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            formData.append('_csrf', token);
            try {
                const resp = await fetch('/api/mkdir', { method: 'POST', body: formData });
                if (resp.status === 403) { window.location.reload(); return; }
                if (!resp.ok) { const txt = await resp.text(); alert("Failed to create folder: " + txt); }
                else { loadFiles(currentPath); }
            } catch (e) { alert("Error: " + e); }
        }

        async function renameItem(name, isDir) {
            const newName = prompt("Rename " + name + " to:", name);
            if (!newName || newName === name) return;
            if (/[<>\[\]:/\\|?*"]/.test(newName)) {
                alert('Name contains invalid characters: <>[]:/\\|?*"');
                return;
            }
            const oldPath = currentPath + name;
            let newPath = currentPath + newName;
            const formData = new FormData();
            formData.append('oldPath', oldPath);
            formData.append('newPath', newPath);
            const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            formData.append('_csrf', token);
            try {
                const resp = await fetch('/api/rename', { method: 'POST', body: formData });
                if (resp.status === 403) { window.location.reload(); return; }
                if (!resp.ok) { const txt = await resp.text(); alert("Failed to rename: " + txt); }
                else { loadFiles(currentPath); }
            } catch (e) { alert("Error: " + e); }
        }

        function escapeHtml(text) {
            if (!text) return text;
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function loadFiles(path) {
            currentPath = path;
            document.getElementById('currentPathDisplay').innerText = path;
            const list = document.getElementById('file-list');
            list.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">Loading...</div>';

            fetch('/api/files?path=' + encodeURIComponent(path))
                .then(response => response.json())
                .then(entries => {
                    if (!entries) {
                        list.innerHTML = `<div style="text-align: center; padding: 20px;">Empty folder</div>`;
                        if (path !== "/") {
                            const parts = path.split('/').filter(p => p);
                            parts.pop();
                            let parent = "/" + parts.join("/");
                            if (!parent.endsWith("/")) parent += "/";
                            list.innerHTML = `
                                <div style="margin-bottom: 10px;">
                                    <a href="#" onclick="loadFiles('${parent}')" class="btn" style="padding: 5px 10px; font-size: 0.8em;">&larr; Back</a>
                                </div>
                                <div style="text-align: center; padding: 20px;">No files found.</div>`;
                        }
                        return;
                    }

                    entries.sort((a, b) => {
                        if (a.Type === b.Type) return a.Name.localeCompare(b.Name);
                        return a.Type === 1 ? -1 : 1;
                    });

                    let html = '<div style="display: flex; flex-direction: column; gap: 5px;">';

                    if (path !== "/") {
                        const parts = path.split('/').filter(p => p);
                        parts.pop();
                        let parent = "/" + parts.join("/");
                        if (!parent.endsWith("/")) parent += "/";
                        html += `
                        <div class="file-item" style="padding: 10px; border-bottom: 1px solid #eee;">
                            <a href="#" onclick="loadFiles('${parent}')" style="display: flex; align-items: center; gap: 10px;">
                                <span>🔙</span> <strong>.. (Parent Directory)</strong>
                            </a>
                        </div>`;
                    }

                    entries.forEach((e, index) => {
                        const uniqueId = 'menu-' + index;
                        const escapedName = escapeHtml(e.Name);
                        const fullPath = escapeHtml(path + e.Name);

                        // Menu content
                        let menuItems = `
                            ${e.Type !== 1 ? `<a href="/api/download?path=${encodeURIComponent(path + e.Name)}" target="_blank">⬇️ Download</a><div class="dropdown-divider"></div>` : ''}
                            <button onclick="renameItem('${escapedName}', ${e.Type === 1})">✎ Rename</button>
                            <button onclick="deleteFile('${fullPath}')" style="color: #d9534f;">🗑️ Delete</button>
                        `;

                        if (e.Type === 1) { // Directory
                            const newPath = path + e.Name + "/";
                            html += `
                            <div class="file-item" style="padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between;">
                                <a href="#" onclick="loadFiles('${newPath}')" style="display: flex; align-items: center; gap: 10px; flex: 1;">
                                    <span style="font-size: 1.2em;">📂</span> 
                                    <span style="font-weight: 600; color: var(--text-color);">${escapedName}</span>
                                </a>
                                <div class="dropdown">
                                    <button onclick="toggleMenu('${uniqueId}')" class="menu-btn">⋮</button>
                                    <div id="${uniqueId}" class="dropdown-content">
                                        ${menuItems}
                                    </div>
                                </div>
                            </div>`;
                        } else {
                            const sizeMB = (e.Size / 1024 / 1024).toFixed(2);
                            html += `
                            <div class="file-item" style="padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span style="font-size: 1.2em;">📄</span>
                                    <span>${escapedName}</span>
                                </div>
                                <div style="font-size: 0.9em; display: flex; gap: 15px; align-items: center;">
                                    <span style="color: #666;">${sizeMB} MB</span>
                                    ${e.Name.endsWith('.gcode.3mf') ?
                                    `<button onclick="openPrintModal('${fullPath}')" class="btn btn-primary" style="padding: 5px 10px; font-size: 0.8em; margin-right: 5px;">🖨️ Print</button>`
                                    : ''}
                                    <div class="dropdown">
                                        <button onclick="toggleMenu('${uniqueId}')" class="menu-btn">⋮</button>
                                        <div id="${uniqueId}" class="dropdown-content">
                                            ${menuItems}
                                        </div>
                                    </div>
                                </div>
                            </div>`;
                        }
                    });
                    html += '</div>';
                    list.innerHTML = html;
                })
                .catch(err => {
                    console.error("File list error:", err);
                    list.innerHTML = "Error loading files.";
                });
        }

        async function deleteFile(filename) {
            if (!confirm(`Are you sure you want to delete "${filename}"?`)) {
                return;
            }

            const formData = new FormData();
            formData.append("file", filename);
            const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            formData.append("_csrf", token);

            try {
                const response = await fetch('/api/delete', {
                    method: 'POST',
                    body: formData
                });

                if (response.status === 403) {
                    alert("Session expired or invalid. Reloading...");
                    window.location.reload();
                    return;
                }

                if (response.ok) {
                    loadFiles(currentPath);
                } else {
                    const text = await response.text();
                    alert("Delete failed: " + text);
                }
            } catch (error) {
                alert("Delete failed: " + error);
            }
        }

        loadFiles('/');

        function openPrintModal(fullPath) {
            document.getElementById('printModal').style.display = 'flex';
            document.getElementById('printFilename').innerText = fullPath.split('/').pop();
            document.getElementById('printExistingPath').value = fullPath;
            fetch('/api/status').then(r => r.json()).then(d => {
                if (d.print && d.print.ams && d.print.ams.ams_exist_bits !== "0") {
                    document.getElementById('chkUseAMS').checked = true;
                }
            });
        }

        function closePrintModal() {
            document.getElementById('printModal').style.display = 'none';
        }

        function startPrint(e) {
            e.preventDefault();
            const form = document.getElementById('printForm');
            const btn = document.getElementById('startBtn');
            const data = new FormData(form);
            const token = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
            btn.disabled = true;
            btn.innerText = "Starting...";
            fetch('/api/print', {
                method: 'POST',
                headers: { 'X-CSRF-Token': token },
                body: data
            }).then(resp => {
                if (resp.status === 403) {
                    alert("Session expired or invalid. Reloading...");
                    window.location.reload();
                    return;
                }
                if (!resp.ok) resp.text().then(text => alert("Start failed: " + text));
                else {
                    closePrintModal();
                    alert("Print started!");
                    window.location.href = "/";
                }
            }).finally(() => {
                btn.disabled = false;
                btn.innerText = "Start Print";
            });
        }

    </script>
</body>

</html>
